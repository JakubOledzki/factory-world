name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-retries 10
    env:
      FW_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=factory;Password=factory
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build --logger "trx;LogFileName=results.trx"
      - name: List failed tests
        if: failure()
        run: |
          {
            echo "### Failed tests"
            grep -ho 'testName="[^"]*" [^>]*outcome="Failed"' tests/*/TestResults/results.trx \
              | sed -E 's/testName="([^"]*)".*/- `\1`/'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  client:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Import project and check scripts
        working-directory: client
        run: |
          ../godot --headless --import
          # Loads every script and scene; exits non-zero if any fails to compile.
          ../godot --headless --script res://tools/check_scripts.gd 2>&1 | tee check.log
          ! grep -E "SCRIPT ERROR|Parse Error" check.log
