[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="world/*.gz"
exclude_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"theme-color\" content=\"#0c0c0d\">
<style>
html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#fw-rotate { display: none; position: fixed; inset: 0; z-index: 100; background: #0c0c0d; color: #e6e1d6; font: 600 20px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
#fw-rotate b { display: block; color: #f5b041; font-size: 26px; margin-bottom: 12px; }
@media (orientation: portrait) and (pointer: coarse) { #fw-rotate { display: flex; } }
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
	const note = document.createElement('div');
	note.id = 'fw-rotate';
	note.innerHTML = '<div><b>Factory World</b>Obróć telefon poziomo, żeby grać.</div>';
	document.body.appendChild(note);
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
